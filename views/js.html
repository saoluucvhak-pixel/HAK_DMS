  // ===== Đồng bộ Danh mục Sổ & Loại Văn bản Toàn Hệ thống =====
  populateCategorySelects: function(forceReload, callback) {
    var token = AUTH.getToken();
    var receiveCat = document.getElementById("receive-category");
    var draftCat = document.getElementById("draft-category");
    var incomingFilterCat = document.getElementById("incoming-filter-category");
    var outgoingFilterCat = document.getElementById("outgoing-filter-category");

    function applyData(types) {
      if (!types || !Array.isArray(types)) return;
      var activeTypes = types.filter(function(t) { return t.status !== "INACTIVE"; });

      if (receiveCat) {
        var curValRec = receiveCat.value;
        receiveCat.innerHTML = '<option value="">-- Chọn loại sổ / văn bản --</option>';
        activeTypes.forEach(function(t) {
          var sel = (t.code === curValRec || t.id === curValRec) ? "selected" : "";
          receiveCat.innerHTML += '<option value="' + t.code + '" ' + sel + '>' + DMS.escapeHtml(t.name) + ' (' + DMS.escapeHtml(t.prefix || t.code) + ')</option>';
        });
      }

      if (draftCat) {
        var curValDraft = draftCat.value;
        draftCat.innerHTML = '<option value="">-- Chọn loại sổ / văn bản --</option>';
        activeTypes.forEach(function(t) {
          var sel = (t.code === curValDraft || t.id === curValDraft) ? "selected" : "";
          draftCat.innerHTML += '<option value="' + t.code + '" ' + sel + '>' + DMS.escapeHtml(t.name) + ' (' + DMS.escapeHtml(t.prefix || t.code) + ')</option>';
        });
      }

      if (incomingFilterCat) {
        var curFilterInc = incomingFilterCat.value;
        incomingFilterCat.innerHTML = '<option value="ALL">Tất cả loại văn bản</option>';
        types.forEach(function(t) {
          var sel = (t.code === curFilterInc) ? "selected" : "";
          incomingFilterCat.innerHTML += '<option value="' + t.code + '" ' + sel + '>' + DMS.escapeHtml(t.name) + ' (' + DMS.escapeHtml(t.prefix || t.code) + ')</option>';
        });
      }

      if (outgoingFilterCat) {
        var curFilterOut = outgoingFilterCat.value;
        outgoingFilterCat.innerHTML = '<option value="ALL">Tất cả loại văn bản</option>';
        types.forEach(function(t) {
          var sel = (t.code === curFilterOut) ? "selected" : "";
          outgoingFilterCat.innerHTML += '<option value="' + t.code + '" ' + sel + '>' + DMS.escapeHtml(t.name) + ' (' + DMS.escapeHtml(t.prefix || t.code) + ')</option>';
        });
      }

      if (typeof callback === "function") callback(types);
    }

    if (DMS.cachedDocumentTypes && !forceReload) {
      applyData(DMS.cachedDocumentTypes);
      return;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          DMS.cachedDocumentTypes = res.data;
          applyData(res.data);
        }
      })
      .apiGetDocumentTypesList(token);
  },

  // ===== Đồng bộ Danh mục Phòng ban Toàn Hệ thống =====
  populateDepartmentSelects: function(forceReload, callback) {
    var token = AUTH.getToken();
    var receiveDept = document.getElementById("receive-department");
    var draftDept = document.getElementById("draft-department");
    var incomingFilterDept = document.getElementById("incoming-filter-dept");
    var outgoingFilterDept = document.getElementById("outgoing-filter-dept");
    var usersFilterDept = document.getElementById("users-filter-dept");
    var userFormDept = document.getElementById("user-form-dept");

    function applyData(depts) {
      if (!depts || !Array.isArray(depts)) return;
      var activeDepts = depts.filter(function(d) { return d.status !== "INACTIVE" && d.status !== "DELETED"; });

      if (receiveDept) {
        var curValRec = receiveDept.value;
        receiveDept.innerHTML = '<option value="">-- Chọn phòng ban phụ trách --</option>';
        activeDepts.forEach(function(d) {
          var sel = (d.id === curValRec) ? "selected" : "";
          receiveDept.innerHTML += '<option value="' + d.id + '" ' + sel + '>' + DMS.escapeHtml(d.name) + ' (' + DMS.escapeHtml(d.code) + ')</option>';
        });
      }

      if (draftDept) {
        var curValDraft = draftDept.value;
        draftDept.innerHTML = '<option value="">-- Chọn phòng ban soạn thảo --</option>';
        activeDepts.forEach(function(d) {
          var sel = (d.id === curValDraft) ? "selected" : "";
          draftDept.innerHTML += '<option value="' + d.id + '" ' + sel + '>' + DMS.escapeHtml(d.name) + ' (' + DMS.escapeHtml(d.code) + ')</option>';
        });
      }

      if (incomingFilterDept) {
        var curFilterInc = incomingFilterDept.value;
        incomingFilterDept.innerHTML = '<option value="ALL">Tất cả phòng ban</option>';
        depts.forEach(function(d) {
          if (d.status !== "DELETED") {
            var sel = (d.id === curFilterInc) ? "selected" : "";
            incomingFilterDept.innerHTML += '<option value="' + d.id + '" ' + sel + '>' + DMS.escapeHtml(d.name) + '</option>';
          }
        });
      }

      if (outgoingFilterDept) {
        var curFilterOut = outgoingFilterDept.value;
        outgoingFilterDept.innerHTML = '<option value="ALL">Tất cả phòng ban</option>';
        depts.forEach(function(d) {
          if (d.status !== "DELETED") {
            var sel = (d.id === curFilterOut) ? "selected" : "";
            outgoingFilterDept.innerHTML += '<option value="' + d.id + '" ' + sel + '>' + DMS.escapeHtml(d.name) + '</option>';
          }
        });
      }

      if (usersFilterDept) {
        var curFilterUser = usersFilterDept.value;
        usersFilterDept.innerHTML = '<option value="ALL">Tất cả phòng ban</option>';
        depts.forEach(function(d) {
          if (d.status !== "DELETED") {
            var sel = (d.id === curFilterUser) ? "selected" : "";
            usersFilterDept.innerHTML += '<option value="' + d.id + '" ' + sel + '>' + DMS.escapeHtml(d.name) + '</option>';
          }
        });
      }

      if (userFormDept) {
        var curUserForm = userFormDept.value;
        userFormDept.innerHTML = '<option value="">-- Chọn phòng ban --</option>';
        activeDepts.forEach(function(d) {
          var sel = (d.id === curUserForm) ? "selected" : "";
          userFormDept.innerHTML += '<option value="' + d.id + '" ' + sel + '>' + DMS.escapeHtml(d.name) + '</option>';
        });
      }

      if (typeof callback === "function") callback(depts);
    }

    if (DMS.cachedDepartments && !forceReload) {
      applyData(DMS.cachedDepartments);
      return;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          DMS.cachedDepartments = res.data;
          applyData(res.data);
        }
      })
      .apiGetDepartmentsList(token);
  },

  // ===== Quản lý Danh mục Loại Sổ & Loại Văn Bản (CRUD) =====
  loadDocumentTypes: function() {
    var tbody = document.getElementById("document-types-tbody");
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px;"><div class="spinner-inline" style="margin: 0 auto 8px auto;"></div>Đang tải danh mục loại sổ...</td></tr>';
    var token = AUTH.getToken();

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red; padding: 20px;">' + (res && res.message ? res.message : "Không thể tải loại sổ") + '</td></tr>';
          return;
        }

        DMS.cachedDocumentTypes = res.data;
        if (!res.data || res.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px;">Chưa có loại sổ nào trong hệ thống.</td></tr>';
          return;
        }

        var html = "";
        res.data.forEach(function(dt) {
          var isSystem = dt.is_system;
          var statusBadge = (dt.status === "ACTIVE")
            ? '<span class="badge badge-success">Hoạt động</span>'
            : '<span class="badge badge-secondary" style="background:#64748b; color:#fff;">Đã khóa</span>';
          var countBadge = '<span class="badge badge-secondary" style="font-size: 12px;">' + (dt.document_count || 0) + ' văn bản</span>';

          var btnEdit = '<button class="btn btn-secondary btn-sm" onclick="DMS.openDocumentTypeModal(\'' + dt.id + '\')" title="Chỉnh sửa thông tin loại sổ">✏️ Sửa</button>';
          
          var toggleTitle = (dt.status === "ACTIVE") ? "Khóa loại sổ này" : "Mở kích hoạt loại sổ";
          var toggleBtn = (dt.status === "ACTIVE")
            ? '<button class="btn btn-secondary btn-sm" onclick="DMS.toggleDocumentTypeStatus(\'' + dt.id + '\', \'ACTIVE\')" title="' + toggleTitle + '">🔒 Khóa</button>'
            : '<button class="btn btn-success btn-sm" onclick="DMS.toggleDocumentTypeStatus(\'' + dt.id + '\', \'INACTIVE\')" title="' + toggleTitle + '">🔓 Mở</button>';

          var btnDelete = '';
          if (!isSystem && (!dt.document_count || dt.document_count === 0)) {
            var safeName = DMS.escapeAttr(dt.name || dt.code);
            btnDelete = '<button class="btn btn-danger btn-sm" onclick="DMS.deleteDocumentType(\'' + dt.id + '\', \'' + safeName + '\')" title="Xóa loại sổ">🗑️ Xóa</button>';
          } else if (isSystem) {
            btnDelete = '<button class="btn btn-secondary btn-sm" disabled title="Loại sổ hệ thống cốt lõi không được xóa" style="opacity: 0.5; cursor: not-allowed;">🔒 Cốt lõi</button>';
          } else {
            btnDelete = '<button class="btn btn-secondary btn-sm" disabled title="Đang có ' + dt.document_count + ' văn bản sử dụng loại này (hãy Khóa thay vì Xóa)" style="opacity: 0.5; cursor: not-allowed;">🔒 Có văn bản</button>';
          }

          html += '<tr>' +
            '<td><span style="font-family: monospace; font-size: 11px; color: var(--text-muted);">' + DMS.escapeHtml(dt.id || "") + '</span></td>' +
            '<td><code style="font-weight: 700; color: var(--primary);">' + DMS.escapeHtml(dt.code || "") + '</code></td>' +
            '<td><strong>' + DMS.escapeHtml(dt.name || "") + '</strong></td>' +
            '<td><span class="badge" style="background:#e0f2fe; color:#0369a1; font-family: monospace;">' + DMS.escapeHtml(dt.prefix || "-") + '</span></td>' +
            '<td><span style="color: var(--text-muted); font-size: 12px;">' + DMS.escapeHtml(dt.description || "-") + '</span></td>' +
            '<td>' + countBadge + '</td>' +
            '<td>' + statusBadge + '</td>' +
            '<td><div style="display: flex; gap: 6px; flex-wrap: wrap;">' + btnEdit + toggleBtn + btnDelete + '</div></td>' +
            '</tr>';
        });
        tbody.innerHTML = html;
      })
      .withFailureHandler(function(err) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red; padding: 20px;">Lỗi kết nối: ' + (err.message || err) + '</td></tr>';
      })
      .apiGetDocumentTypesList(token);
  },

  openDocumentTypeModal: function(typeId) {
    var form = document.getElementById("form-doctype-edit");
    if (form) form.reset();

    var titleEl = document.getElementById("doctype-modal-title");
    var idInput = document.getElementById("doctype-form-id");
    var codeInput = document.getElementById("doctype-form-code");
    var nameInput = document.getElementById("doctype-form-name");
    var prefixInput = document.getElementById("doctype-form-prefix");
    var descInput = document.getElementById("doctype-form-description");
    var statusSelect = document.getElementById("doctype-form-status");

    idInput.value = typeId || "";

    if (typeId) {
      if (titleEl) titleEl.innerText = "✏️ Chỉnh sửa Loại Sổ / Loại Văn Bản";
      var docType = null;
      if (DMS.cachedDocumentTypes) {
        docType = DMS.cachedDocumentTypes.find(function(t) { return t.id === typeId; });
      }

      if (docType) {
        codeInput.value = docType.code || "";
        nameInput.value = docType.name || "";
        prefixInput.value = docType.prefix || "";
        descInput.value = docType.description || "";
        if (statusSelect) statusSelect.value = docType.status || "ACTIVE";

        if (docType.is_system || ["DT_CV", "DT_QD", "DT_TT", "DT_TB"].indexOf(docType.code) !== -1) {
          codeInput.setAttribute("readonly", "readonly");
          codeInput.style.backgroundColor = "#f1f5f9";
        } else {
          codeInput.removeAttribute("readonly");
          codeInput.style.backgroundColor = "";
        }
      }
    } else {
      if (titleEl) titleEl.innerText = "➕ Thêm Loại Sổ / Loại Văn Bản Mới";
      codeInput.removeAttribute("readonly");
      codeInput.style.backgroundColor = "";
      if (statusSelect) statusSelect.value = "ACTIVE";
    }

    DMS.openModal("modal-doctype-form");
  },

  submitDocumentTypeForm: function() {
    var id = document.getElementById("doctype-form-id").value;
    var code = document.getElementById("doctype-form-code").value.trim().toUpperCase();
    var name = document.getElementById("doctype-form-name").value.trim();
    var prefix = document.getElementById("doctype-form-prefix").value.trim();
    var description = document.getElementById("doctype-form-description").value.trim();
    var status = document.getElementById("doctype-form-status").value;

    if (!code) {
      APP.toast("Vui lòng nhập mã code định danh!", "error");
      return;
    }
    if (!name) {
      APP.toast("Vui lòng nhập tên loại sổ / văn bản!", "error");
      return;
    }

    var typeData = {
      id: id,
      code: code,
      name: name,
      prefix: prefix,
      description: description,
      status: status
    };

    var token = AUTH.getToken();
    APP.setButtonLoading("btn-save-doctype", true, "Đang lưu loại sổ...");

    google.script.run
      .withSuccessHandler(function(res) {
        APP.setButtonLoading("btn-save-doctype", false);
        if (res && res.success) {
          APP.toast(res.message || "Lưu loại sổ thành công!", "success");
          DMS.closeModal("modal-doctype-form");
          DMS.cachedDocumentTypes = null;
          DMS.loadDocumentTypes();
          DMS.populateCategorySelects(true);
        } else {
          APP.toast(res && res.message ? res.message : "Không thể lưu loại sổ", "error");
        }
      })
      .withFailureHandler(function(err) {
        APP.setButtonLoading("btn-save-doctype", false);
        APP.toast("Lỗi hệ thống: " + (err.message || err), "error");
      })
      .apiSaveDocumentType(typeData, token);
  },

  toggleDocumentTypeStatus: function(typeId, currentStatus) {
    var newStatus = (currentStatus === "ACTIVE") ? "INACTIVE" : "ACTIVE";
    var actionName = (newStatus === "INACTIVE") ? "khóa" : "kích hoạt lại";
    if (!confirm("Bạn có chắc chắn muốn " + actionName + " loại sổ này?")) return;

    var token = AUTH.getToken();
    APP.startLoading();
    APP.toast("Đang cập nhật trạng thái...", "info");

    google.script.run
      .withSuccessHandler(function(res) {
        APP.stopLoading();
        if (res && res.success) {
          APP.toast(res.message || "Đã cập nhật trạng thái thành công!", "success");
          DMS.cachedDocumentTypes = null;
          DMS.loadDocumentTypes();
          DMS.populateCategorySelects(true);
        } else {
          APP.toast(res && res.message ? res.message : "Không thể cập nhật trạng thái", "error");
        }
      })
      .withFailureHandler(function(err) {
        APP.stopLoading();
        APP.toast("Lỗi hệ thống: " + (err.message || err), "error");
      })
      .apiToggleDocumentTypeStatus(typeId, newStatus, token);
  },

  deleteDocumentType: function(typeId, typeName) {
    if (!confirm("Bạn có chắc chắn muốn xóa loại sổ [" + typeName + "]? Thao tác này không thể hoàn tác!")) {
      return;
    }

    var token = AUTH.getToken();
    APP.startLoading();
    APP.toast("Đang xóa loại sổ...", "info");

    google.script.run
      .withSuccessHandler(function(res) {
        APP.stopLoading();
        if (res && res.success) {
          APP.toast(res.message || "Đã xóa loại sổ thành công!", "success");
          DMS.cachedDocumentTypes = null;
          DMS.loadDocumentTypes();
          DMS.populateCategorySelects(true);
        } else {
          APP.toast(res && res.message ? res.message : "Không thể xóa loại sổ", "error");
        }
      })
      .withFailureHandler(function(err) {
        APP.stopLoading();
        APP.toast("Lỗi hệ thống: " + (err.message || err), "error");
      })
      .apiDeleteDocumentType(typeId, token);
  },

  // ===== Quản lý Hồ sơ Pháp lý Doanh nghiệp (CRUD) =====
  legalRecordTypes: [
    { code: "GPDKKD", name: "Giấy chứng nhận đăng ký kinh doanh / đăng ký doanh nghiệp" },
    { code: "DIEU_LE", name: "Điều lệ công ty" },
    { code: "BIEN_BAN_HOP_HDTV", name: "Biên bản họp Hội đồng thành viên" },
    { code: "QUYET_DINH", name: "Quyết định (HĐTV / Giám đốc)" },
    { code: "GPMT", name: "Giấy phép môi trường" },
    { code: "GCN_MST", name: "Giấy chứng nhận đăng ký thuế" },
    { code: "MAU_DAU", name: "Thông báo / Giấy chứng nhận mẫu dấu" },
    { code: "GIAY_PHEP_KHAC", name: "Giấy phép con khác (PCCC, ATTP, ngành nghề có điều kiện...)" },
    { code: "KHAC", name: "Khác" }
  ],

  escapeHtml: function(str) {
    return String(str === null || str === undefined ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  },

  // Dùng riêng khi chèn giá trị vào bên trong onclick="...('...')" (thoát " cho thuộc tính HTML, thoát ' cho chuỗi JS)
  escapeAttr: function(str) {
    return String(str === null || str === undefined ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "\\'");
  },

  getLegalRecordTypeName: function(code) {
    var found = this.legalRecordTypes.find(function(t) { return t.code === code; });
    return found ? found.name : code;
  },

  populateLegalRecordTypeSelects: function() {
    var filterSelect = document.getElementById("legal-filter-type");
    var formSelect = document.getElementById("legal-form-type");

    if (filterSelect && filterSelect.options.length <= 1) {
      DMS.legalRecordTypes.forEach(function(t) {
        filterSelect.innerHTML += '<option value="' + t.code + '">' + DMS.escapeHtml(t.name) + '</option>';
      });
    }

    if (formSelect) {
      var curVal = formSelect.value;
      formSelect.innerHTML = '<option value="">-- Chọn loại hồ sơ --</option>';
      DMS.legalRecordTypes.forEach(function(t) {
        var sel = (t.code === curVal) ? "selected" : "";
        formSelect.innerHTML += '<option value="' + t.code + '" ' + sel + '>' + DMS.escapeHtml(t.name) + '</option>';
      });
    }
  },

  getLegalExpiryBadge: function(r) {
    if (r.expiry_status === "EXPIRED") return '<span class="badge badge-danger">Đã hết hạn (' + Math.abs(r.days_remaining) + ' ngày)</span>';
    if (r.expiry_status === "DUE_SOON") return '<span class="badge badge-warning">Sắp hết hạn (còn ' + r.days_remaining + ' ngày)</span>';
    if (r.expiry_status === "VALID") return '<span class="badge badge-success">Còn hiệu lực</span>';
    return '<span class="badge badge-secondary">Không thời hạn</span>';
  },

  loadLegalRecords: function(page) {
    DMS.populateLegalRecordTypeSelects();

    var tbody = document.getElementById("legal-records-tbody");
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 24px;"><div class="spinner-inline" style="margin: 0 auto 8px auto;"></div>Đang tải hồ sơ pháp lý...</td></tr>';

    var token = AUTH.getToken();
    var params = {
      page: page || 1,
      pageSize: 10,
      type: document.getElementById("legal-filter-type") ? document.getElementById("legal-filter-type").value : "ALL",
      status: document.getElementById("legal-filter-status") ? document.getElementById("legal-filter-status").value : "ALL",
      search: document.getElementById("legal-filter-search") ? document.getElementById("legal-filter-search").value.trim() : ""
    };

    var btnAdd = document.getElementById("btn-add-legal-record");
    if (btnAdd) btnAdd.style.display = APP.hasPermission("legal_records.manage") ? "inline-flex" : "none";

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red; padding: 20px;">' + DMS.escapeHtml(res && res.message ? res.message : "Lỗi nạp hồ sơ pháp lý") + '</td></tr>';
          return;
        }

        var data = res.data || {};
        var list = data.items || [];
        DMS._lastLegalRecordsList = list;

        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px;">Chưa có hồ sơ pháp lý nào được lưu trữ.</td></tr>';
        } else {
          var canManage = APP.hasPermission("legal_records.manage");
          var html = "";
          list.forEach(function(r) {
            var fileCell = r.file_id
              ? '<a href="https://drive.google.com/file/d/' + encodeURIComponent(r.file_id) + '/view" target="_blank" rel="noopener">📎 ' + DMS.escapeHtml(r.file_name || "Xem tệp") + '</a>'
              : '<span style="color: var(--text-muted);">Chưa có tệp</span>';

            var actions = '<div style="display: flex; gap: 6px; flex-wrap: wrap;">';
            if (canManage) {
              actions += '<button class="btn btn-secondary btn-sm" onclick="DMS.openLegalRecordModal(\'' + r.id + '\')">Sửa</button>';
              actions += '<button class="btn btn-danger btn-sm" onclick="DMS.deleteLegalRecord(\'' + r.id + '\', \'' + DMS.escapeAttr(r.title) + '\')">Xóa</button>';
            } else {
              actions += '<span style="color: var(--text-muted); font-size: 12px;">Chỉ xem</span>';
            }
            actions += '</div>';

            html += '<tr>' +
              '<td><span class="badge badge-primary">' + DMS.escapeHtml(DMS.getLegalRecordTypeName(r.type)) + '</span></td>' +
              '<td><strong>' + DMS.escapeHtml(r.title) + '</strong>' + (r.notes ? ('<br><small style="color:var(--text-muted);">' + DMS.escapeHtml(r.notes) + '</small>') : '') + '</td>' +
              '<td>' + DMS.escapeHtml(r.number || "-") + '</td>' +
              '<td>' + DMS.escapeHtml(r.issuing_authority || "-") + '</td>' +
              '<td>' + (r.issue_date_display || "-") + '</td>' +
              '<td>' + (r.expiry_date_display || "Không thời hạn") + '<br>' + DMS.getLegalExpiryBadge(r) + '</td>' +
              '<td>' + fileCell + '</td>' +
              '<td>' + actions + '</td>' +
              '</tr>';
          });
          tbody.innerHTML = html;
        }

        APP.renderPagination("legal-records-pagination", data.pagination, "DMS.loadLegalRecords");
      })
      .withFailureHandler(function(err) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red; padding: 20px;">Lỗi kết nối: ' + DMS.escapeHtml(err.message || err) + '</td></tr>';
      })
      .apiGetLegalRecordsList(params, token);
  },

  openLegalRecordModal: function(recordId) {
    var form = document.getElementById("form-legal-record-edit");
    if (form) form.reset();

    DMS.populateLegalRecordTypeSelects();

    var titleEl = document.getElementById("legal-record-modal-title");
    document.getElementById("legal-form-id").value = recordId || "";
    document.getElementById("legal-form-file-id").value = "";
    document.getElementById("legal-form-file-name").value = "";
    var fileInfo = document.getElementById("legal-form-file-info");
    if (fileInfo) fileInfo.textContent = "Tệp tin sẽ được tự động đồng bộ và lưu trữ trên Google Drive.";

    var target = null;
    if (recordId && DMS._lastLegalRecordsList) {
      target = DMS._lastLegalRecordsList.find(function(r) { return r.id === recordId; });
    }

    if (recordId && target) {
      if (titleEl) titleEl.textContent = "✏️ Cập Nhật Hồ Sơ Pháp Lý";
      document.getElementById("legal-form-type").value = target.type || "";
      document.getElementById("legal-form-title").value = target.title || "";
      document.getElementById("legal-form-number").value = target.number || "";
      document.getElementById("legal-form-authority").value = target.issuing_authority || "";
      document.getElementById("legal-form-issue-date").value = target.issue_date || "";
      document.getElementById("legal-form-expiry-date").value = target.expiry_date || "";
      document.getElementById("legal-form-status").value = target.status || "ACTIVE";
      document.getElementById("legal-form-notes").value = target.notes || "";
      document.getElementById("legal-form-file-id").value = target.file_id || "";
      document.getElementById("legal-form-file-name").value = target.file_name || "";
      if (target.file_id && fileInfo) {
        fileInfo.textContent = "Đã có tệp: " + (target.file_name || "tệp đính kèm") + " (chọn tệp mới nếu muốn thay thế).";
      }
    } else {
      if (titleEl) titleEl.textContent = "➕ Thêm Hồ Sơ Pháp Lý Mới";
      document.getElementById("legal-form-status").value = "ACTIVE";
    }

    DMS.openModal("modal-legal-record-form");
  },

  submitLegalRecordForm: function() {
    var id = document.getElementById("legal-form-id").value;
    var type = document.getElementById("legal-form-type").value;
    var title = document.getElementById("legal-form-title").value.trim();
    var number = document.getElementById("legal-form-number").value.trim();
    var authority = document.getElementById("legal-form-authority").value.trim();
    var issueDate = document.getElementById("legal-form-issue-date").value;
    var expiryDate = document.getElementById("legal-form-expiry-date").value;
    var status = document.getElementById("legal-form-status").value;
    var notes = document.getElementById("legal-form-notes").value.trim();

    if (!type) {
      APP.toast("Vui lòng chọn loại hồ sơ pháp lý.", "error");
      return;
    }
    if (!title) {
      APP.toast("Vui lòng nhập tên / trích yếu hồ sơ.", "error");
      return;
    }

    var token = AUTH.getToken();
    var fileInput = document.getElementById("legal-form-file");

    function saveRecord(fileId, fileName) {
      var recordData = {
        id: id || "",
        type: type,
        title: title,
        number: number,
        issuing_authority: authority,
        issue_date: issueDate,
        expiry_date: expiryDate,
        status: status,
        notes: notes,
        file_id: fileId || "",
        file_name: fileName || ""
      };

      google.script.run
        .withSuccessHandler(function(res) {
          APP.setButtonLoading("btn-save-legal-record", false);
          if (res && res.success) {
            DMS.closeModal("modal-legal-record-form");
            APP.toast(id ? "Cập nhật hồ sơ pháp lý thành công!" : "Thêm hồ sơ pháp lý thành công!", "success");
            DMS.loadLegalRecords(1);
          } else {
            APP.toast((res && res.message) || "Không thể lưu hồ sơ pháp lý.", "error");
          }
        })
        .withFailureHandler(function(err) {
          APP.setButtonLoading("btn-save-legal-record", false);
          APP.toast("Lỗi hệ thống: " + (err.message || err), "error");
        })
        .apiSaveLegalRecord(recordData, token);
    }

    if (fileInput && fileInput.files.length > 0) {
      APP.setButtonLoading("btn-save-legal-record", true, "Đang tải tệp lên Drive...");
      var file = fileInput.files[0];
      var reader = new FileReader();
      reader.onload = function(e) {
        var base64 = e.target.result;
        google.script.run
          .withSuccessHandler(function(uploadRes) {
            if (uploadRes && uploadRes.success) {
              APP.setButtonLoading("btn-save-legal-record", true, "Đang lưu hồ sơ pháp lý...");
              saveRecord(uploadRes.file_id, uploadRes.file_name);
            } else {
              APP.setButtonLoading("btn-save-legal-record", false);
              APP.toast((uploadRes && uploadRes.message) || "Lỗi tải tệp lên Drive.", "error");
            }
          })
          .withFailureHandler(function(err) {
            APP.setButtonLoading("btn-save-legal-record", false);
            APP.toast("Lỗi tải tệp: " + (err.message || err), "error");
          })
          .apiUploadDocumentFile({
            base64Data: base64,
            fileName: file.name,
            mimeType: file.type,
            docType: "LEGAL",
            year: new Date().getFullYear()
          }, token);
      };
      reader.readAsDataURL(file);
    } else {
      APP.setButtonLoading("btn-save-legal-record", true, "Đang lưu hồ sơ pháp lý...");
      var existingFileId = document.getElementById("legal-form-file-id").value;
      var existingFileName = document.getElementById("legal-form-file-name").value;
      saveRecord(existingFileId, existingFileName);
    }
  },

  deleteLegalRecord: function(recordId, recordTitle) {
    if (!confirm("Bạn có chắc chắn muốn xóa hồ sơ pháp lý [" + recordTitle + "]?\nThao tác này không thể hoàn tác (tệp trên Drive sẽ không bị xóa).")) {
      return;
    }

    var token = AUTH.getToken();
    APP.toast("Đang xóa hồ sơ pháp lý...", "info");
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          APP.toast("Đã xóa hồ sơ pháp lý thành công!", "success");
          DMS.loadLegalRecords(1);
        } else {
          APP.toast(res.message, "error");
        }
      })
      .withFailureHandler(function(err) {
        APP.toast(err.message || "Lỗi xóa hồ sơ pháp lý.", "error");
      })
      .apiDeleteLegalRecord(recordId, token);
  },

  // Helper Badges
  getPriorityBadge: function(p) {
    if (p === "FLASH") return '<span class="badge badge-danger">⚡ HỎA TỐC</span>';
    if (p === "VERY_URGENT") return '<span class="badge badge-danger">THƯỢNG KHẨN</span>';
    if (p === "URGENT") return '<span class="badge badge-warning">KHẨN</span>';
    return '<span class="badge badge-secondary">THƯỜNG</span>';
  },

  getStatusBadge: function(s) {
    var cls = this.getStatusBadgeClass(s);
    return '<span class="badge ' + cls + '">' + s + '</span>';
  },

  getStatusBadgeClass: function(s) {
    if (s === "COMPLETED" || s === "APPROVED" || s === "ISSUED") return "badge-success";
    if (s === "PROCESSING" || s === "REVIEWING" || s === "WAITING_APPROVAL" || s === "SUBMITTED") return "badge-warning";
    if (s === "REVISION_REQUIRED") return "badge-danger";
    return "badge-primary";
  }
};

// Khởi chạy ứng dụng ngay khi DOM sẵn sàng
document.addEventListener("DOMContentLoaded", function() {
  APP.init();
});
</script>
